[project]
name = "fsa-agent"
version = "0.1.0"
description = "Financial statement analysis agent for NGX-listed companies (educational analysis, not investment advice)"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.188",
    "duckdb>=1.1",
    "jsonschema>=4",
    "pdfplumber>=0.11.11",
    "pyyaml>=6.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false   # run from source via the ./fsa launcher (macOS hides .venv files, which breaks editable installs)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
